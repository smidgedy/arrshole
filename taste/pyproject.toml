[project]
name = "arr-taste"
version = "0.1.0"
description = "Learns what you keep vs delete in Radarr/Sonarr and proposes `junk` tags for arrshole to apply"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
